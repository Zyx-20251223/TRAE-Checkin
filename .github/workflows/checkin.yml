name: Trae Daily Checkin

on:
  schedule:
    # 每天 5 个候选触发点（北京时间 08:00–16:00，间隔 2 小时）
    # GitHub 只运行 schedule 中的第一个触发点，其余静默跳过
    # 这样每天实际签到时间在 08:00–16:00 之间随机出现
    - cron: "0 0 * * *"   # 08:00
    - cron: "0 2 * * *"   # 10:00
    - cron: "0 4 * * *"   # 12:00
    - cron: "0 6 * * *"   # 14:00
    - cron: "0 8 * * *"   # 16:00
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checkin
        env:
          TRAE_SESSION: ${{ secrets.TRAE_SESSION }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_SESSION_2: ${{ secrets.TRAE_SESSION_2 }}
          TRAE_DEVICE_ID_2: ${{ secrets.TRAE_DEVICE_ID_2 }}
          TRAE_SESSION_3: ${{ secrets.TRAE_SESSION_3 }}
          TRAE_DEVICE_ID_3: ${{ secrets.TRAE_DEVICE_ID_3 }}
          TRAE_SESSION_4: ${{ secrets.TRAE_SESSION_4 }}
          TRAE_DEVICE_ID_4: ${{ secrets.TRAE_DEVICE_ID_4 }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python checkin.py
